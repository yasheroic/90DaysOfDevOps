kind: StatefulSet
apiVersion: apps/v1

metadata:
    name: mysql
spec:
    serviceName: "headless-svc"
    selector:
        matchLabels:
            app: my-app
    template:
        metadata:
            labels:
                app: my-app
        spec:
            containers:
                - name: my-sts-container
                  image: mysql:8.0
                  ports:
                      - containerPort: 3306
                  envFrom:
                      - secretRef:
                            name: my-secret
                  resources:
                      requests:
                          cpu: "250m"
                          memory: "512Mi"
                      limits:
                          cpu: "500m"
                          memory: "1Gi"
                  
                  volumeMounts: 
                      - name: mysql-wordpress-data
                        mountPath: /var/lib/mysql

    volumeClaimTemplates:
        - metadata: 
              name: mysql-wordpress-data
          spec:
              accessModes: ["ReadWriteOnce"]
              resources:
                  requests:
                      storage: 1Gi