kind: Deployment
apiVersion: apps/v1

metadata:
    name: wordpress-deployment
    labels:
        app: wordpress-app
spec:
    selector:
        matchLabels:
            app: wordpress-app
    
    replicas: 2
    
    template:
        metadata:
            labels:
                app: wordpress-app
        spec:
            containers:
                - name: wordpress-container
                  image: wordpress:latest
                  envFrom:
                      - configMapRef:
                            name: my-cm
                  env:
                      - name: WORDPRESS_DB_USER
                        valueFrom:
                            secretKeyRef:
                                name: my-secret
                                key:  MYSQL_USER
                      - name: WORDPRESS_DB_PASSWORD
                        valueFrom:
                            secretKeyRef:
                                name: my-secret
                                key: MYSQL_PASSWORD
                  resources:
                      requests:
                          cpu: "250m"
                          memory: "512Mi"
                      limits:
                          cpu: "500m"
                          memory: "1Gi"
                  livenessProbe:
                      httpGet:
                          path: /wp-login.php
                          port: 80
                      initialDelaySeconds: 40
                      periodSeconds: 10
                      failureThreshold: 5
                  readinessProbe:
                      httpGet:
                          path: /wp-login.php
                          port: 80
                      initialDelaySeconds: 20
                      periodSeconds: 5
                      failureThreshold: 5