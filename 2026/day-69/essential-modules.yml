---
- name: install_modules
  hosts: application
  become: true

  tasks:
    - name: update apt cache- apt updt
      apt:
        update_cache: yes
    - name: Install multiple packages
      apt:
        name: 
          - git
          - curl
          - wget
          - tree
          - nginx
        state: present

    - name: Ensure Nginx is running
      service:
        name: nginx
        state: started
        enabled: true

    - name: Copy config file 
      copy:
        src: files/app.conf
        dest: /etc/app.conf
        owner: root
        group: root
        mode: '0644'

    - name: Create application directory
      file:
        path: /opt/myapp
        state: directory
        owner: ubuntu
        mode: "0755"

    - name: Check disk space
      command: df -h
      register: disk_output

    - name: Print disk space
      debug:
        var: disk_output.stdout_lines

    - name: count running processes
      shell: ps aux | wc -l
      register: process_count

    - name: print prcess_count
      debug:
        msg: "Total processes: {{ process_count.stdout }}"
    
    - name: Set timezone in environment
      lineinfile:
        path: /etc/environment
        line: 'TZ=Asia/Kolkata'
        create: true
