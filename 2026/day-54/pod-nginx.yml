kind: Pod
apiVersion: v1

metadata:
    name: nginx-pod
    labels:
        app: nginx-app

spec:

    containers:
        - name: nginx-container
          image: nginx:latest
          volumeMounts:
              - name: nginx-pod-cm-vol
                mountPath: /etc/nginx/conf.d
    volumes:
        - name: nginx-pod-cm-vol
          configMap: 
              name: nginx-conf