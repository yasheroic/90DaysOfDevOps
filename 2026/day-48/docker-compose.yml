services:
# Database
  mysql:
    image: mysql:8.0
    container_name: learnloop-mysql
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - my_internal_network
    environment:
      - MYSQL_DATABASE=learnloopdb
      - MYSQL_ROOT_PASSWORD=Test@123
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
  
  #App

  learnloop:
    build: .
    container_name: learnloop
    ports:
      - 3000:3000
    networks:
      - my_internal_network
    environment:
      - DATABASE_URL=mysql://root:Test@123@mysql:3306/learnloopdb

    depends_on:
      mysql:
        condition: service_healthy

  
volumes:
  mysql_data:
  ollama_data:


networks:
  my_internal_network:
    driver: bridge


  